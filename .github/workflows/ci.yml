# AutoForge v1.4 CI Workflow
name: AutoForge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Typecheck (Vite + Electron)
        run: npm run build

  backend:
    name: Backend Test Suite & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio imageio-ffmpeg httpx

      - name: Run Backend Pytest Suite
        run: python -m pytest backend/tests

      - name: Verify Artifact Disk Parity & Clean Manifest
        run: |
          python -c "
          import json, hashlib, os
          with open('artifacts/manifest.json', 'r') as mf:
              manifest = json.load(mf)
          csv_bytes = open('artifacts/ai_startups_matrix.csv', 'rb').read()
          computed_hash = hashlib.sha256(csv_bytes).hexdigest()
          assert computed_hash == manifest['csv_sha256'], f'Hash mismatch: {computed_hash} != {manifest[\"csv_sha256\"]}'
          assert 'InjectedRogueCorp' not in csv_bytes.decode('utf-8'), 'Found InjectedRogueCorp in canonical artifact!'
          print('Artifact verification passed cleanly.')
          "
