<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoForge v1.7 — AI-Native Developer Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      h1, h2, h3, .font-display {
        font-family: 'Outfit', 'Inter', sans-serif;
      }
      code, pre, .font-mono {
        font-family: 'Space Grotesk', 'JetBrains Mono', ui-monospace, monospace;
      }
      #autoforge-preloader {
        position: fixed;
        inset: 0;
        background: #07090D;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        color: #FAF7F2;
      }
      .af-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(0, 242, 254, 0.2);
        border-top-color: #00F2FE;
        border-right-color: #0D9488;
        border-radius: 50%;
        animation: af-spin 0.75s linear infinite;
        box-shadow: 0 0 16px rgba(0, 242, 254, 0.4);
      }
      @keyframes af-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#07090D] text-[#0D1117] font-sans antialiased overflow-hidden select-none selection:bg-[#00F2FE]/30 selection:text-[#0D1117]">
    <div id="root">
      <div id="autoforge-preloader">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          <div style="width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#00F2FE,#0D9488);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(0,242,254,0.5);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#07090D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <span style="font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.03em;color:#FAF7F2;">Auto<span style="background:linear-gradient(to right,#00F2FE,#0D9488);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Forge</span></span>
          <span style="font-family:'Space Grotesk',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(0,242,254,0.15);color:#00F2FE;border:1px solid rgba(0,242,254,0.4);">AdaL × VIGIL</span>
        </div>
        <div class="af-spinner"></div>
        <p style="font-family:'Space Grotesk',monospace;font-size:11px;color:#FAF7F2;opacity:0.7;margin-top:16px;letter-spacing:0.05em;">AI-NATIVE MULTI-AGENT BROWSER</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
