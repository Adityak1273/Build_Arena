<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoForge — AI-Native Developer Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      h1, h2, h3, .font-display {
        font-family: 'Outfit', 'Inter', sans-serif;
      }
      code, pre, .font-mono {
        font-family: 'Space Grotesk', 'JetBrains Mono', ui-monospace, monospace;
      }
      #autoforge-preloader {
        position: fixed;
        inset: 0;
        background: #07090E;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        color: #F8FAFC;
      }
      .af-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366F1;
        border-right-color: #06B6D4;
        border-radius: 50%;
        animation: af-spin 0.75s linear infinite;
      }
      @keyframes af-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#07090E] text-slate-100 font-sans antialiased overflow-hidden select-none selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div id="autoforge-preloader">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366F1,#06B6D4);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(99,102,241,0.5);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <span style="font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;letter-spacing:-0.03em;color:#ffffff;">Auto<span style="background:linear-gradient(to right,#818CF8,#38BDF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Forge</span></span>
          <span style="font-family:'Space Grotesk',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(99,102,241,0.15);color:#A5B4FC;border:1px solid rgba(99,102,241,0.3);">AdaL × VIGIL</span>
        </div>
        <div class="af-spinner"></div>
        <p style="margin-top:14px;font-size:12px;color:#94A3B8;font-family:'Space Grotesk',monospace;letter-spacing:0.04em;">Mounting AI Browser Core & CDP Bridge...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
