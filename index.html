<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoForge — AI-Native Developer Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      #autoforge-preloader {
        position: fixed;
        inset: 0;
        background: #F8FAFC;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        color: #0F172A;
      }
      .af-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(234, 88, 12, 0.2);
        border-top-color: #ea580c;
        border-radius: 50%;
        animation: af-spin 0.75s linear infinite;
      }
      @keyframes af-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased overflow-hidden select-none selection:bg-orange-500 selection:text-white">
    <div id="root">
      <div id="autoforge-preloader">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          <div style="width:36px;height:36px;border-radius:10px;background:#0F172A;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(15,23,42,0.15);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          </div>
          <span style="font-size:18px;font-weight:800;letter-spacing:-0.02em;color:#0F172A;">Auto<span style="color:#ea580c;">Forge</span></span>
          <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:#FFF7ED;color:#c2410c;border:1px solid #fed7aa;">AdaL Core</span>
        </div>
        <div class="af-spinner"></div>
        <p style="margin-top:14px;font-size:12px;color:#64748B;font-family:monospace;letter-spacing:0.02em;">Mounting AI Browser Core & CDP Bridge...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
